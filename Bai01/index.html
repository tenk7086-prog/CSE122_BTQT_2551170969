        <h1>
            BỐN MÙA
        </h1>
        <p class="p1">Xuân về hoa nở khắp trời <br> Hạ sang nắng cháy rạng ngời phố quen <br> Thu về lá rụng bên thềm</p>
        <hr>
        <p class="p2">Đông sang gió lạnh bên em đợi chờ <br> Bốn mùa là bốn giấc mơ <br> Thời gian đi mãi ta chờ đợi ai</p>
        <hr>
        <p class="p1">Một năm rồi lại một năm <br> Vẫn còn câu hát thì thầm quê hương <br> Chờ xuân nắng mới soi đường</p>
